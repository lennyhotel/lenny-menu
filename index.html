<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lenny Hotel - Menu ya Kisasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFC107;
    --yellow-bright:#FFD54F;
    --yellow-light:#FFF8E1;
    --maroon:#7B1E1E;
    --maroon-dark:#4A0E0E;
    --maroon-light:#A83232;
    --cream:#FFFDF7;
    --dark:#1a1a1a;
    --shadow-sm:0 2px 8px rgba(123,30,30,.08);
    --shadow-md:0 8px 24px rgba(123,30,30,.15);
    --shadow-lg:0 20px 50px rgba(123,30,30,.25);
    --grad-maroon:linear-gradient(135deg,#7B1E1E 0%,#4A0E0E 100%);
    --grad-yellow:linear-gradient(135deg,#FFC107 0%,#FFD54F 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--cream);
    color:var(--dark);
    padding-bottom:110px;
    overflow-x:hidden;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--yellow-light);}
  ::-webkit-scrollbar-thumb{background:var(--maroon);border-radius:10px;}

  /* ====== HEADER ====== */
  header{
    background:var(--grad-maroon);
    color:var(--yellow);
    text-align:center;
    padding:35px 15px 25px;
    position:relative;
    overflow:hidden;
    border-bottom:5px solid var(--yellow);
  }
  header::before{
    content:'';position:absolute;top:-50%;left:-50%;
    width:200%;height:200%;
    background:radial-gradient(circle,rgba(255,193,7,.15) 0%,transparent 60%);
    animation:rotate 20s linear infinite;
  }
  @keyframes rotate{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  header h1{
    font-family:'Playfair Display',serif;
    font-size:2.4rem;
    letter-spacing:2px;
    position:relative;
    text-shadow:2px 2px 0 rgba(0,0,0,.3);
    animation:fadeDown .8s ease;
  }
  header h1 span{color:#fff;}
  header p{
    color:#FFE082;font-size:.85rem;margin-top:6px;
    letter-spacing:3px;text-transform:uppercase;
    position:relative;animation:fadeUp .8s ease .2s both;
  }
  .header-badge{
    display:inline-block;margin-top:12px;
    background:var(--yellow);color:var(--maroon-dark);
    padding:6px 18px;border-radius:20px;
    font-size:.75rem;font-weight:700;letter-spacing:1px;
    position:relative;animation:fadeUp .8s ease .4s both;
  }
  @keyframes fadeDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

  /* ====== SEARCH BAR ====== */
  .search-wrap{
    max-width:900px;margin:-22px auto 0;padding:0 15px;
    position:relative;z-index:50;
  }
  .search-box{
    background:#fff;border-radius:50px;
    padding:5px 5px 5px 20px;
    display:flex;align-items:center;gap:10px;
    box-shadow:var(--shadow-md);
    border:2px solid var(--yellow);
  }
  .search-box svg{width:20px;height:20px;fill:var(--maroon);flex-shrink:0;}
  .search-box input{
    flex:1;border:none;outline:none;
    font-size:.9rem;padding:10px 0;
    background:transparent;font-family:'Poppins',sans-serif;
  }
  .search-box input::placeholder{color:#aaa;}

  /* ====== CATEGORY NAV ====== */
  .cat-nav{
    display:flex;gap:10px;overflow-x:auto;
    padding:18px 15px 12px;
    scrollbar-width:none;
    max-width:900px;margin:0 auto;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-nav button{
    flex:0 0 auto;
    background:#fff;color:var(--maroon-dark);
    border:2px solid #f0e0b0;
    padding:9px 18px;border-radius:50px;
    font-weight:600;font-size:.78rem;cursor:pointer;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    white-space:nowrap;
    font-family:'Poppins',sans-serif;
    box-shadow:var(--shadow-sm);
  }
  .cat-nav button:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-md);
    border-color:var(--yellow);
  }
  .cat-nav button.active{
    background:var(--grad-maroon);color:var(--yellow);
    border-color:var(--maroon);
    transform:translateY(-3px);
    box-shadow:var(--shadow-md);
  }

  /* ====== MAIN ====== */
  main{padding:10px 15px;max-width:900px;margin:auto;}
  section{margin-bottom:35px;scroll-margin-top:20px;}

  .section-title{
    display:flex;align-items:center;gap:12px;
    margin-bottom:15px;
  }
  .section-title .icon{
    width:44px;height:44px;border-radius:12px;
    background:var(--grad-yellow);
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
    box-shadow:var(--shadow-sm);
    flex-shrink:0;
  }
  .section-title h2{
    font-family:'Playfair Display',serif;
    color:var(--maroon-dark);
    font-size:1.35rem;
    letter-spacing:.5px;
  }
  .section-title .line{
    flex:1;height:2px;
    background:linear-gradient(to right,var(--yellow),transparent);
    border-radius:2px;
  }

  /* ====== MENU GRID ====== */
  .items-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:14px;
  }
  .item-card{
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    transition:all .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
    border:1px solid #f5ecd5;
    position:relative;
    animation:cardIn .5s ease backwards;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
  .item-card:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow-lg);
    border-color:var(--yellow);
  }
  .item-img{
    width:100%;height:130px;
    background:linear-gradient(135deg,#FFF3C4,#FFE082);
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:3rem;
  }
  .item-img img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .5s ease;
  }
  .item-card:hover .item-img img{transform:scale(1.1);}
  .item-img::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.3),transparent 50%);
    pointer-events:none;
  }
  .price-tag{
    position:absolute;bottom:8px;right:8px;
    background:var(--maroon);color:var(--yellow);
    padding:4px 10px;border-radius:20px;
    font-size:.72rem;font-weight:700;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
    z-index:2;
  }
  .item-body{
    padding:12px;
    display:flex;flex-direction:column;flex:1;
    gap:8px;
  }
  .item-name{
    font-weight:600;font-size:.85rem;
    color:var(--maroon-dark);
    line-height:1.3;
    min-height:2.2em;
  }
  .item-desc{
    font-size:.68rem;color:#888;
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .add-btn{
    margin-top:auto;
    width:100%;
    background:var(--grad-yellow);
    color:var(--maroon-dark);
    border:none;border-radius:10px;
    padding:9px;
    font-weight:700;font-size:.78rem;
    cursor:pointer;
    transition:all .2s;
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Poppins',sans-serif;
  }
  .add-btn:hover{
    background:var(--grad-maroon);
    color:var(--yellow);
    transform:scale(1.02);
  }
  .add-btn:active{transform:scale(.97);}
  .add-btn.added{background:#25D366;color:#fff;}

  /* ====== CART FLOATING BAR ====== */
  .cart-bar{
    position:fixed;bottom:15px;left:50%;
    transform:translateX(-50%);
    background:var(--grad-maroon);
    color:var(--yellow);
    padding:12px 20px;
    border-radius:50px;
    display:flex;align-items:center;gap:14px;
    box-shadow:0 10px 30px rgba(74,14,14,.4);
    z-index:200;cursor:pointer;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    border:2px solid var(--yellow);
    max-width:calc(100% - 30px);
  }
  .cart-bar:hover{transform:translateX(-50%) translateY(-4px);box-shadow:0 15px 40px rgba(74,14,14,.5);}
  .cart-bar.pulse{animation:pulse 1s ease;}
  @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.05);}}
  .cart-icon{
    position:relative;
    background:var(--yellow);color:var(--maroon-dark);
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;flex-shrink:0;
  }
  .cart-count{
    position:absolute;top:-6px;right:-6px;
    background:#E53935;color:#fff;
    border-radius:50%;width:20px;height:20px;
    font-size:.68rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--maroon);
  }
  .cart-info{display:flex;flex-direction:column;line-height:1.2;}
  .cart-info .label{font-size:.65rem;text-transform:uppercase;letter-spacing:1px;color:#FFE082;}
  .cart-info .total{font-size:1rem;font-weight:700;color:var(--yellow);}

  /* ====== MODAL ====== */
  .modal{
    display:none;position:fixed;inset:0;
    background:rgba(26,26,26,.7);
    backdrop-filter:blur(6px);
    z-index:300;
    align-items:flex-end;justify-content:center;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal.open{display:flex;}
  .modal-content{
    background:var(--cream);
    width:100%;max-width:500px;
    max-height:88vh;border-radius:25px 25px 0 0;
    display:flex;flex-direction:column;
    animation:slideUp .35s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal-header{
    background:var(--grad-maroon);
    color:var(--yellow);
    padding:18px 20px;
    display:flex;justify-content:space-between;align-items:center;
    font-weight:700;font-size:1.1rem;
    border-bottom:3px solid var(--yellow);
  }
  .modal-header button{
    background:rgba(255,255,255,.15);border:none;
    color:var(--yellow);font-size:1.5rem;
    cursor:pointer;line-height:1;
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .modal-header button:hover{background:rgba(255,255,255,.3);transform:rotate(90deg);}
  .cart-items{flex:1;overflow-y:auto;padding:8px 15px;}
  .cart-item{
    display:flex;gap:12px;
    padding:12px 0;
    border-bottom:1px dashed #e5d5a0;
    align-items:center;
    animation:fadeIn .3s ease;
  }
  .cart-item-img{
    width:55px;height:55px;border-radius:12px;
    background:var(--yellow-light);
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;flex-shrink:0;
    overflow:hidden;
  }
  .cart-item-img img{width:100%;height:100%;object-fit:cover;}
  .cart-item-info{flex:1;min-width:0;}
  .cart-item-name{
    font-weight:600;font-size:.85rem;
    color:var(--maroon-dark);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cart-item-price{font-size:.75rem;color:#8a6d00;margin-top:2px;}
  .qty-controls{
    display:flex;align-items:center;gap:6px;
    background:var(--yellow-light);
    border-radius:20px;padding:3px;
  }
  .qty-controls button{
    background:#fff;border:none;
    width:28px;height:28px;border-radius:50%;
    font-weight:700;cursor:pointer;
    color:var(--maroon-dark);
    transition:all .2s;
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    box-shadow:var(--shadow-sm);
  }
  .qty-controls button:hover{background:var(--yellow);transform:scale(1.1);}
  .qty-controls span{
    font-weight:700;min-width:22px;text-align:center;
    font-size:.85rem;color:var(--maroon-dark);
  }
  .cart-empty{
    text-align:center;padding:50px 20px;color:#999;
  }
  .cart-empty .emoji{font-size:3rem;display:block;margin-bottom:12px;}
  .cart-empty .text{font-size:.9rem;}

  .modal-footer{
    padding:16px 20px 20px;
    border-top:2px solid var(--yellow);
    background:#fff;
  }
  .grand-total{
    display:flex;justify-content:space-between;
    font-weight:700;font-size:1.15rem;
    color:var(--maroon-dark);
    margin-bottom:14px;
    padding:10px 14px;
    background:var(--yellow-light);
    border-radius:10px;
  }
  .grand-total span:last-child{color:var(--maroon);}
  .customer-info{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .customer-info input,.customer-info textarea{
    padding:11px 14px;
    border:2px solid #f0e0b0;border-radius:10px;
    font-size:.85rem;outline:none;
    font-family:'Poppins',sans-serif;
    transition:border-color .2s;
    background:#fff;
    resize:none;
  }
  .customer-info input:focus,.customer-info textarea:focus{border-color:var(--yellow);}
  .wa-btn{
    width:100%;background:#25D366;color:#fff;
    border:none;padding:14px;border-radius:12px;
    font-size:.95rem;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:all .25s;
    font-family:'Poppins',sans-serif;
    box-shadow:0 6px 20px rgba(37,211,102,.35);
  }
  .wa-btn:hover{background:#1da851;transform:translateY(-2px);box-shadow:0 10px 25px rgba(37,211,102,.5);}
  .wa-btn:active{transform:translateY(0);}
  .wa-btn:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;transform:none;}

  /* ====== TOAST ====== */
  .toast{
    position:fixed;top:20px;left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:var(--maroon);color:var(--yellow);
    padding:12px 22px;border-radius:50px;
    font-size:.85rem;font-weight:600;
    box-shadow:var(--shadow-lg);
    z-index:500;
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;align-items:center;gap:8px;
    border:2px solid var(--yellow);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  /* ====== EMPTY STATE ====== */
  .no-results{
    text-align:center;padding:40px 20px;
    color:#999;grid-column:1/-1;
  }
  .no-results .emoji{font-size:3rem;display:block;margin-bottom:10px;}

  /* ====== RESPONSIVE ====== */
  @media(max-width:480px){
    header h1{font-size:1.7rem;}
    .items-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .item-img{height:110px;}
    .item-name{font-size:.78rem;}
  }
  @media(min-width:768px){
    .items-grid{grid-template-columns:repeat(3,1fr);}
    header h1{font-size:3rem;}
  }
</style>
</head>
<body>

<header>
  <h1>Lenny <span>Hotel</span></h1>
  <p>Food & Beverage Menu</p>
  <div class="header-badge">⭐ Bei zote ni TSh ⭐</div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Tafuta chakula... (mfano: pizza, chicken)">
  </div>
</div>

<div class="cat-nav" id="catNav"></div>
<main id="menu"></main>

<!-- CART BAR -->
<div class="cart-bar" id="cartBar" onclick="openCart()">
  <div class="cart-icon">
    🛒
    <span class="cart-count" id="cartCount">0</span>
  </div>
  <div class="cart-info">
    <div class="label">Oda Yangu</div>
    <div class="total" id="cartTotal">TSh 0</div>
  </div>
</div>

<!-- CART MODAL -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>🛒 Oda Yako</span>
      <button onclick="closeCart()">×</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="modal-footer">
      <div class="grand-total">
        <span>JUMLA:</span>
        <span id="grandTotal">TSh 0</span>
      </div>
      <div class="customer-info">
        <input type="text" id="custName" placeholder="Jina lako (hiari)">
        <textarea id="custNote" rows="2" placeholder="Maelezo ya ziada (hiari) - mfano: bila pilipili"></textarea>
      </div>
      <button class="wa-btn" id="waBtn" onclick="sendWhatsApp()">
        📲 Tuma Oda kwa WhatsApp
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const foodImages = {

  avocado:     "https://images.unsplash.com/photo-1601039641847-7857b994d704?w=400&h=300&fit=crop",
  potato:      "https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400&h=300&fit=crop",
  coleslaw:    "https://images.unsplash.com/photo-1625938145744-e38051539998?w=400&h=300&fit=crop",
  cantonese:   "https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=400&h=300&fit=crop",
  honey:       "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=400&h=300&fit=crop",

/* ============ STATE ============ */
let cart = {};
let activeCat = null;

/* ============ RENDER ============ */
const menuEl = document.getElementById('menu');
const catNavEl = document.getElementById('catNav');

function renderMenu(filter=""){
  menuEl.innerHTML = '';
  const f = filter.toLowerCase().trim();
  let found = false;

  menuData.forEach((section, idx) => {
    const filtered = section.items.filter(it =>
      it.name.toLowerCase().includes(f) || (it.desc && it.desc.toLowerCase().includes(f))
    );
    if(filtered.length === 0) return;
    found = true;

    const sec = document.createElement('section');
    sec.id = 'sec-'+idx;
    sec.innerHTML = `
      <div class="section-title">
        <div class="icon">${section.icon}</div>
        <h2>${section.cat}</h2>
        <div class="line"></div>
      </div>
      <div class="items-grid"></div>
    `;
    const grid = sec.querySelector('.items-grid');

    filtered.forEach((it, i) => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.style.animationDelay = (i * 0.04) + 's';
      const priceTxt = it.price > 0 ? `TSh ${it.price.toLocaleString()}` : 'Uliza bei';
      const imgUrl = foodImages[it.img] || foodImages.chicken;
      const key = section.cat + '|' + it.name;

      card.innerHTML = `
        <div class="item-img">
          <img src="${imgUrl}" alt="${it.name}" loading="lazy" onerror="this.style.display='none';this.parentElement.textContent='🍽️';this.parentElement.style.fontSize='2.5rem'">
          <span class="price-tag">${priceTxt}</span>
        </div>
        <div class="item-body">
          <div class="item-name">${it.name}</div>
          ${it.desc ? `<div class="item-desc">${it.desc}</div>` : ''}
          <button class="add-btn" data-key="${key}" data-name="${it.name}" data-price="${it.price}">
            <span>＋</span> Ongeza
          </button>
        </div>
      `;
      grid.appendChild(card);
    });
    menuEl.appendChild(sec);
  });

  if(!found){
    menuEl.innerHTML = `
      <div class="no-results">
        <span class="emoji">🔍</span>
        <p>Hakuna chakula kilichopatikana kwa "<strong>${filter}</strong>"</p>
      </div>
    `;
  }

  // Attach add-to-cart handlers
  document.querySelectorAll('.add-btn').forEach(btn => {
    btn.onclick = () => {
      addToCart(btn.dataset.key, btn.dataset.name, parseInt(btn.dataset.price));
      btn.classList.add('added');
      btn.innerHTML = '<span>✓</span> Imeongezwa';
      setTimeout(()=>{
        btn.classList.remove('added');
        btn.innerHTML = '<span>＋</span> Ongeza';
      }, 1200);
    };
  });
}

function renderCatNav(){
  catNavEl.innerHTML = '';
  menuData.forEach((section, idx) => {
    const btn = document.createElement('button');
    btn.textContent = section.icon + ' ' + section.cat;
    btn.onclick = () => {
      document.getElementById('sec-'+idx).scrollIntoView({behavior:'smooth', block:'start'});
      document.querySelectorAll('.cat-nav button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    };
    catNavEl.appendChild(btn);
  });
}

/* ============ CART ============ */
function addToCart(key, name, price){
  if(!cart[key]) cart[key] = {name, price, qty:0};
  cart[key].qty++;
  updateCartUI();
  showToast(`✓ ${name} imeongezwa`);
  const bar = document.getElementById('cartBar');
  bar.classList.add('pulse');
  setTimeout(()=>bar.classList.remove('pulse'), 600);
}

function changeQty(key, delta){
  if(!cart[key]) return;
  cart[key].qty += delta;
  if(cart[key].qty <= 0) delete cart[key];
  updateCartUI();
  renderCartItems();
}

function updateCartUI(){
  const keys = Object.keys(cart);
  const count = keys.reduce((s,k)=>s+cart[k].qty,0);
  const total = keys.reduce((s,k)=>s+cart[k].qty*cart[k].price,0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = 'TSh ' + total.toLocaleString();
  document.getElementById('grandTotal').textContent = 'TSh ' + total.toLocaleString();
  document.getElementById('waBtn').disabled = count === 0;
  document.getElementById('cartBar').style.display = count === 0 ? 'none' : 'flex';
}

function getItemImage(name){
  // find matching image
  for(const section of menuData){
    for(const it of section.items){
      if(it.name === name) return foodImages[it.img] || foodImages.chicken;
    }
  }
  return foodImages.chicken;
}

function renderCartItems(){
  const box = document.getElementById('cartItems');
  const keys = Object.keys(cart);
  if(keys.length === 0){
    box.innerHTML = '<div class="cart-empty"><span class="emoji">🛒</span><div class="text">Oda yako ni tupu.<br>Chagua vyakula kwenye menu.</div></div>';
    return;
  }
  box.innerHTML = '';
  keys.forEach(k=>{
    const it = cart[k];
    const img = getItemImage(it.name);
    const div = document.createElement('div');
    div.className = 'cart-item';
    div.innerHTML = `
      <div class="cart-item-img"><img src="${img}" alt="${it.name}"></div>
      <div class="cart-item-info">
        <div class="cart-item-name">${it.name}</div>
        <div class="cart-item-price">TSh ${it.price.toLocaleString()} × ${it.qty} = <strong>TSh ${(it.price*it.qty).toLocaleString()}</strong></div>
      </div>
      <div class="qty-controls">
        <button>−</button>
        <span>${it.qty}</span>
        <button>+</button>
      </div>
    `;
    const btns = div.querySelectorAll('.qty-controls button');
    btns[0].onclick = () => changeQty(k, -1);
    btns[1].onclick = () => changeQty(k, +1);
    box.appendChild(div);
  });
}

function openCart(){
  renderCartItems();
  document.getElementById('cartModal').classList.add('open');
}
function closeCart(){
  document.getElementById('cartModal').classList.remove('open');
}
document.getElementById('cartModal').addEventListener('click', e=>{
  if(e.target.id === 'cartModal') closeCart();
});

/* ============ WHATSAPP ============ */
function sendWhatsApp(){
  const keys = Object.keys(cart);
  if(keys.length === 0) return;
  const name = document.getElementById('custName').value.trim();
  const note = document.getElementById('custNote').value.trim();
  const total = keys.reduce((s,k)=>s+cart[k].qty*cart[k].price,0);

  let msg = '🍽️ *ODA MPYA - LENNY HOTEL*\n';
  msg += '━━━━━━━━━━━━━━━\n\n';
  if(name) msg += `👤 *Jina:* ${name}\n\n`;
  msg += '*VYAKULA:*\n';
  keys.forEach(k=>{
    const it = cart[k];
    msg += `• ${it.qty}× ${it.name} — TSh ${(it.price*it.qty).toLocaleString()}\n`;
  });
  msg += '\n━━━━━━━━━━━━━━━\n';
  msg += `💰 *JUMLA: TSh ${total.toLocaleString()}*\n`;
  if(note) msg += `\n📝 *Maelezo:* ${note}\n`;
  msg += '\nAsante! 🙏';

  const phone = '255769001978';
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ SEARCH ============ */
document.getElementById('searchInput').addEventListener('input', e=>{
  renderMenu(e.target.value);
});

/* ============ INIT ============ */
renderCatNav();
renderMenu();
updateCartUI();
